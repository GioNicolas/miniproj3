# O Render free desliga a API depois de 15 minutos sem uso, e o disco dele não
# é persistente: ao acordar, o SQLite volta só com o seed, e todo mundo perde a
# sessão e o que criou. Um acesso a cada 10 minutos mantém a API ligada (as 750
# horas grátis por mês cobrem um serviço ligado o tempo todo).
# O GitHub pode atrasar execuções agendadas em horários de pico.
name: manter-api-acordada

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acessa a API
        run: curl -fsS -m 90 --retry 3 --retry-delay 20 -o /dev/null https://rede-trilha-api.onrender.com/docs
